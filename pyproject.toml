[project]
name = "mat3ra-parsers"
dynamic = ["version"]
description = "Parsers."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.md"}
authors = [
    {name = "Exabyte Inc.", email = "info@mat3ra.com"}
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development",
]
dependencies = [
    "mat3ra-esse>=2026.6.30.post0",
    "mat3ra-fixtures",
    "mat3ra-made>=2026.7.4.post0",
    "mat3ra-regex>=2026.7.4.post0",
    "numpy",
    "pymatgen",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
    "ruff",
    "isort",
    "mypy",
]
tests = [
    "coverage[toml]>=5.3",
    "pip-tools",
    "pytest",
    "pytest-cov",
]
all = ["mat3ra-parsers[dev,tests]"]

# Entrypoint scripts can be defined here, see examples below.
[project.scripts]
# my-script = "my_package.my_module:my_function"


[build-system]
requires = [
    "setuptools>=42",
    "setuptools-scm[toml]>=3.4"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
git_describe_command = "git describe --tags --long"

[tool.setuptools.packages.find]
where = ["src/py"]

[tool.black]
line-length = 120
target-version = ['py38']
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
(
    examples\/.*\/.*\.py
  | other\/.*\/.*\.(py|ipynb)
)
'''

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "src/js"
]
line-length = 120
target-version = "py38"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
